name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Librerías
        run: python -m pip install -r requirements.txt

      - name: Construir la App (APK)
        run: python -m flet build apk --project-name fiadoapp --project-version "1.0.0"

      - name: Entregar Archivo Final
        uses: actions/upload-artifact@v4
        with:
          name: FiadoApp-APK
          path: build/apk/**/*.apk
